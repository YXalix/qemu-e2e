[workspace]
resolver = "2"
members = [
    "cli",
    "crates/builder",
    "crates/launcher",
    "crates/judge",
    "crates/guardian",
    "crates/tracker",
    "crates/forge",
]
exclude = [
    # 测试用例固件是独立 workspace（testfw std + C 体 build.rs 编入），不进主依赖图
    "infra/testcases",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ctrlc = "3"
common = { path = "crates/common" }
builder = { path = "crates/builder" }
launcher = { path = "crates/launcher" }
judge = { path = "crates/judge" }
guardian = { path = "crates/guardian" }
tracker = { path = "crates/tracker" }
forge = { path = "crates/forge" }
