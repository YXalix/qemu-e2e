[package]
# bin 名 = 包名 virtuoso（src/main.rs 自动识别）；cargo install --path . 装入 PATH。
name = "virtuoso"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
common.workspace = true
judge.workspace = true
launcher.workspace = true
builder.workspace = true
forge.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/builder",
    "crates/launcher",
    "crates/judge",
    "crates/forge",
]
exclude = [
    # 测试用例固件是独立 workspace（coda std 框架 + C 体 coda-scaffold 编入），不进主依赖图
    "infra/testcases",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ctrlc = "3"
common = { path = "crates/common" }
builder = { path = "crates/builder" }
launcher = { path = "crates/launcher" }
judge = { path = "crates/judge" }
forge = { path = "crates/forge" }
