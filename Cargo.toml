[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/builder",
    "crates/launcher",
    "crates/judge",
    "crates/guardian",
    "crates/tracker",
]
exclude = [
    # 测试用例固件是独立 workspace（no_std，裸 syscall），不进主依赖图
    "infra/testcases/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
