[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde_json = "1"
toml = "0.8"
common = { path = "../crates/common" }
judge = { path = "../crates/judge" }
guardian = { path = "../crates/guardian" }
launcher = { path = "../crates/launcher" }
builder = { path = "../crates/builder" }
tracker = { path = "../crates/tracker" }

[dependencies.serde]
version = "1"
features = ["derive"]
