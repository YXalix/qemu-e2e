# Kernel modules for the test environment (loaded AFTER switch_root).
# Copied into rootfs.img /lib/modules and insmodded by the test init
# (infra/init) from there. Boot-critical modules (virtio, ext4, ...) live
# in modules-boot.conf instead — the initramfs must carry those because
# they are needed before the root filesystem exists.
# One module per line; tokens after the name are passed verbatim to insmod.

# NVMe block device support (optional test disk, disk.qcow2)
crc64
crc64-rocksoft
t10-pi
nvme-core
nvme

# Virtio serial（tools/virtuoso-agent 的传输层：AI probe 通道）
virtio_console
