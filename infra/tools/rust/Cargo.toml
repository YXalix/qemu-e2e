[workspace]
resolver = "2"
members = ["rt", "agent"]

# tools workspace：VM 内常驻工具（非用例，不进 /tests，不参与标记协议判定）。
# 与 testcases/rust 同款裸机约束：no_std + 自定义 _start + 裸 syscall，
# 产物为纯静态 ELF（-nostdlib -static，见 .cargo/config.toml）。
# 由 builder::tools::install_rust 以 `cargo build --release` 编译，
# 产物拷入 rootfs 的 /bin/（工具命名空间 virtuoso-*）。

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
