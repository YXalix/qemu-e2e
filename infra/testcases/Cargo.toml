[workspace]
resolver = "2"
# 用例目录走 glob：新用例 = 丢一个 test-<name>/ 目录进来，无需编辑本文件
members = ["coda", "coda-build", "test-*"]

# 独立 workspace：测试用例固件不进入 virtuoso 主 workspace 的依赖图
# （根 Cargo.toml 有对应 exclude）。由 builder::testcase::install_rust 以
# `cargo build --release --target <musl triple>` 编译，产物拷入 rootfs 的
# /tests/（init 自动发现）。每个 test-* member = 一个用例二进制；C 测试体
# 放在用例 crate 的 c/ 下，由该 crate 的一行 build.rs（coda-build）编入同一
# 二进制；coda = 测试框架，coda-build = build.rs 共享实现。

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
# VM 内无动态加载器：-static 冻结约束。musl 目标 crt-static 是 rustc
# 默认行为，且 rustc 自含 musl libc.a + rust-lld（与 infra/tools 同配方），
# 这里零 rustflags；宿主不需要 musl 交叉工具链，只需要
# `rustup target add <triple>`。
#
# builder 恒以 `--target <musl triple>` 构建（testcase::install_rust）；
# 非 Linux 宿主由 builder 注入 CARGO_TARGET_<TRIPLE>_LINKER（zig cc 包装，
# 见 builder::cross，并附 -C link-self-contained=no 让 zig 供给 crt1/libc）。
# C 测试体的编译器由 builder 注入 CC_<TRIPLE>（同一个 zig cc 包装），
# 见用例 crate 的 build.rs。
