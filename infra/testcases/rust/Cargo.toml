[workspace]
resolver = "2"
members = ["framework", "test-rs-example"]

# 独立 workspace：测试用例固件不进入 virtuoso 主 workspace 的依赖图。
# 由 overture::testcase::install_rust 以 `cargo build --release` 编译，
# 产物拷入 rootfs 的 /tests/（init 自动发现）。

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
