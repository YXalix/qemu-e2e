# VM 内无动态加载器：-static 冻结约束（与 C 侧 CMakeLists 的 -static 对齐）；
# -nostdlib -nostartfiles：无 libc、无 crt0，入口由框架 _start 提供，
# 系统调用走裸 syscall（编译产物为纯静态 ELF，约几十 KB）。
#
# builder 恒以 `--target <musl triple>` 构建（testcase::install_rust），故
# rustflags 挂在显式 triple 上——不再按宿主 OS 判定（macOS 宿主同样生效）。
# link-self-contained=no：拒绝 rustc 为 musl 目标配发的自含 crt1.o——
# 它自带 _start/main 语义，与框架的 _start 冲突（multiple definition）。
# 链接器缺省为 rustc 自含 rust-lld / 宿主 cc；非 Linux 宿主由 builder 注入
# CARGO_TARGET_<TRIPLE>_LINKER（zig cc 包装，见 builder::cross）。
[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "link-self-contained=no",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-pie",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "link-self-contained=no",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-pie",
]

[target.riscv64gc-unknown-linux-musl]
rustflags = [
    "-C", "link-self-contained=no",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-pie",
]
