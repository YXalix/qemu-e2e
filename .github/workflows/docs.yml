name: docs

# 文档站点：docs/ 是唯一事实来源（书根 = docs/，mdBook 配置在其内），构建后发布到 GitHub Pages（gh-pages）。
# - 触发：main 上 docs/** 或本工作流变更；或手动 workflow_dispatch。
# - 仓库需一次性开启：Settings → Pages → Source = GitHub Actions。
# - 线上地址：https://yxalix.github.io/virtuoso/
# - 本地预览：virtuoso docs --serve（工作区别名 cargo xtask docs）。

on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy mdBook
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build Book
        run: mdbook build docs
        # 书根 = docs/（docs/book.toml）；create-missing = false：SUMMARY 引用不存在的文档会在此硬失败

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
