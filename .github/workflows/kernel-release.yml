name: kernel-release

# mainline preset 内核构建与发布 —— kernel_preset = "mainline" 的供给端。
#
# 产物：GitHub Release（tag kernel-v<版本>），资产 = 三架构 mini 内核
# （defconfig + infra/kernel/fragment.config，全 =y 零模块）+ config +
# SHA256SUMS；`virtuoso fetch` 消费。同时开 bump PR 把 infra/kernel/pin
# 推进到新版本 —— 合并即采用（e2e-mainline 先在新 pin 上跑绿），不自动追新。
#
# 触发：每周一检查 kernel.org 新 mainline；也可手动 dispatch 指定版本补建。
# mainline .0 约 9-10 周一个，构建三架构约 1-2h（4 核托管 runner，在时限内）。

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: '内核版本（如 6.12.8）；留空 = kernel.org 当前 mainline'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: build & publish preset kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version || '' }}" ]; then
            ver="${{ inputs.version }}"
          else
            ver="$(curl -fsSL https://www.kernel.org/version.json | jq -r .mainline)"
          fi
          ver="${ver#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "kernel-v$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "kernel-v$ver already published, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cross toolchains
        if: steps.ver.outputs.exists != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu jq

      - name: Build three arches
        if: steps.ver.outputs.exists != 'true'
        run: |
          bash infra/kernel/build-preset.sh \
            "${{ steps.ver.outputs.version }}" "$PWD/out" "$PWD/linux-src"
          ls -lh out/

      - name: Publish release (kernel-v*)
        if: steps.ver.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "kernel-v$VER" out/* \
            -R "$GITHUB_REPOSITORY" \
            --title "mainline preset kernel v$VER" \
            --notes "mainline mini kernel (defconfig + infra/kernel/fragment.config, all =y).

          Consume: \`virtuoso fetch\` (or pin in infra/kernel/pin).
          Assets: Image-{arm64,x86_64,riscv64} + config-* + SHA256SUMS."

      - name: Open pin bump PR
        if: steps.ver.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          branch="kernel-pin-v$VER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          cat > infra/kernel/pin <<EOF
          # mainline preset 内核钉定版本 —— virtuoso fetch 缺省拉取的版本。
          # 留空 = 跟随最新已发布 release（kernel-v* tag）；写入版本号（如 6.12.8）即钉定。
          # kernel-release 工作流发布新版本后会开 bump PR 更新本文件，合并即采用。
          $VER
          EOF
          git add infra/kernel/pin
          git commit -m "chore(kernel): pin preset mainline v$VER"
          git push origin "$branch"
          gh pr create \
            -R "$GITHUB_REPOSITORY" \
            --title "chore(kernel): pin preset mainline v$VER" \
            --body "kernel-v$VER 已发布。合并本 PR 即采用为新缺省 preset 内核；e2e-mainline 会先在新 pin 上验证。发现回归就 close 这个 PR（旧 release 不受影响）。" \
            --base main --head "$branch"
