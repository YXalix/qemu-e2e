name: busybox-release

# 预编译静态 BusyBox（arm64 / x86_64 / riscv64）并发布到 GitHub Release。
#
# 构建环境钉死在 ubuntu:22.04 容器：busybox 1.36.1 的 tc applet 无法在
# 内核头文件 >= 6.8 下编译，且交叉 gcc 的头文件搜索行为随发行版漂移；
# 容器化保证三架构构建可复现。
#
# 使用方式：
#   1. workflow_dispatch 手动触发（默认 1.36.1）；
#   2. 或推送 tag：git tag busybox-v1.36.1 && git push origin busybox-v1.36.1
# 产物（assets）：busybox-<version>-linux-{arm64,x86_64,riscv64}
# 宿主侧下载：见 infra/fetch-busybox.sh 与 .env.example。

on:
  workflow_dispatch:
    inputs:
      busybox_version:
        description: 'BusyBox version (e.g. 1.36.1)'
        required: false
        default: '1.36.1'
  push:
    tags:
      - 'busybox-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: build & publish
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_RAW: ${{ inputs.busybox_version || github.ref_name }}
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            wget tar bzip2 gzip file make gcc libc6-dev curl ca-certificates \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            libc6-dev-arm64-cross libc6-dev-riscv64-cross

      - name: Resolve version
        run: |
          VERSION="${VERSION_RAW#busybox-v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building BusyBox ${VERSION} for x86_64 / arm64 / riscv64"

      - name: Build static busybox (3 arches)
        run: |
          set -e
          cd /tmp
          wget -q "https://busybox.net/downloads/busybox-${VERSION}.tar.bz2"
          tar xf "busybox-${VERSION}.tar.bz2"
          cd "busybox-${VERSION}"

          build_one() {
            local arch="$1" cross="$2"
            make -s clean >/dev/null 2>&1 || true
            make defconfig CROSS_COMPILE="${cross}" >/dev/null
            sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
            # tc applet 不进 initramfs；且无法在内核头文件 >= 6.8 下编译
            sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
            make -j"$(nproc)" CROSS_COMPILE="${cross}" >/dev/null
            file busybox | grep -qi 'statically linked' \
              || { echo "ERROR: ${arch} busybox is not statically linked"; exit 1; }
            cp busybox "/tmp/busybox-${VERSION}-linux-${arch}"
            echo "OK: busybox-${VERSION}-linux-${arch}"
          }

          build_one x86_64 ""
          build_one arm64  "aarch64-linux-gnu-"
          build_one riscv64 "riscv64-linux-gnu-"
          ls -lh /tmp/busybox-*-linux-*

      - name: Publish release (REST API)
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          # 幂等：release 已存在则复用，否则创建
          REL=$(curl -fsSL -H "$AUTH" "${API}/releases/tags/busybox-v${VERSION}" 2>/dev/null || true)
          if [ -z "$REL" ] || echo "$REL" | grep -q '"Not Found"'; then
            curl -fsSL -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "${API}/releases" \
              -d "{\"tag_name\":\"busybox-v${VERSION}\",\"name\":\"BusyBox ${VERSION} (static)\",\"body\":\"Statically-linked BusyBox ${VERSION} for the qemu-e2e / Virtuoso initramfs (defconfig + CONFIG_STATIC=y, built in ubuntu:22.04).\"}" \
              > /tmp/rel.json
          else
            echo "$REL" > /tmp/rel.json
          fi

          UPLOAD_URL=$(sed -n 's/.*"upload_url": *"\([^"]*\)".*/\1/p' /tmp/rel.json | sed 's/{.*}//')
          for f in /tmp/busybox-*-linux-*; do
            echo "Uploading $(basename "$f")"
            curl -fsSL -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=$(basename "$f")" --data-binary "@$f" > /dev/null
          done
          echo "Release ready: https://github.com/${GITHUB_REPOSITORY}/releases/tag/busybox-v${VERSION}"
