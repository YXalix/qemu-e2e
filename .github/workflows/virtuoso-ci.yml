name: virtuoso-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build & Test (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # tools 装载（musl 静态）的 target 可用性由 builder 单测把守
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit Tests
        run: cargo test --workspace

  # macOS（Apple Silicon）单元回归：代码全部走 Unix 可移植 API，单测即可
  # 把守平台分支（argv 双冻结基线 / cpio newc / HostOs）。brew 依赖对应
  # verify 的 macOS host_tools 表（见 builder::verify）。
  build-test-macos:
    name: Build & Test (unit, macOS)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit Tests
        run: cargo test --workspace

  # 内核 E2E（boot + 标记协议断言）需要内核树与 KVM/TCG 资源，
  # 放在自建 runner（openEuler 宿主，virtuoso.toml 指向内核树）上手动触发。
  # runner 前置：zig（C 测试体编译器，verify 硬闸门）、内核树、KVM。
  # runner 上以 systemd 服务或 tmux 会话常驻 virtuoso 均可；
  # 产物 target/runs/ 会由 triage 消化，失败时把 runs 目录整体上传。
  kernel-e2e:
    name: E2E (self-hosted, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, openeuler-kernel]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Virtuoso
        run: cargo install --path .

      - name: Virtuoso Doctor
        run: virtuoso doctor --verbose

      - name: Execute E2E Suite
        run: virtuoso test --timeout 600

      - name: Triage
        if: always()
        run: virtuoso triage || true

      - name: Upload Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtuoso-runs
          path: target/runs/

  # 装置 E2E：mainline preset 内核（kernel-v* release 资产，infra/kernel/pin
  # 钉定）TCG 引导，验证 harness 引导链路（init → busybox → testcases →
  # judge）。被测内核行为的权威仍是自建 openEuler 的 kernel-e2e；本 job
  # 每次 push 守装置自身。pin 指向的 release 不存在时跳过（首次发布前）。
  e2e-mainline:
    name: E2E (preset kernel, TCG)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Install zig
        uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.16.0

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-system-x86 qemu-system-misc

      - name: Install Virtuoso
        run: cargo install --path .

      - name: Fetch preset kernel
        id: fetch
        continue-on-error: true
        env:
          KERNEL_PRESET: mainline
        run: virtuoso fetch

      - name: Virtuoso Doctor
        if: steps.fetch.outcome == 'success'
        env:
          KERNEL_PRESET: mainline
        run: virtuoso doctor --verbose

      - name: Build test assets
        if: steps.fetch.outcome == 'success'
        env:
          KERNEL_PRESET: mainline
        run: virtuoso build

      - name: Execute E2E (TCG)
        if: steps.fetch.outcome == 'success'
        env:
          KERNEL_PRESET: mainline
        run: virtuoso test --timeout 300

      - name: Triage
        if: always()
        run: virtuoso triage || true

      - name: Upload Run Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: virtuoso-e2e-runs
          path: target/runs/
